# Classes the detector learns. Tag labels are NOT a class: OCR finds and reads them.
# `prompts` are the descriptions OWLv2 uses to draw first-guess boxes (pre-labels).
# Change a prompt freely; changing a class name means updating docs/contracts.md (component_type).
version: 0.2
classes:
  - id: 1
    name: power_supply
    description: DIN-rail power supply unit (PS.. tags), and redundancy modules (D13, D23) for now
    prompts:
      - "a DIN rail power supply unit"
      - "a grey industrial power supply module"
  - id: 2
    name: mcb
    description: Miniature circuit breaker or isolator on a DIN rail (CB.., DS.. tags)
    prompts:
      - "a miniature circuit breaker"
      - "a white circuit breaker with a black switch"
  - id: 3
    name: io_module
    description: One I/O carrier column block (the stacks of modules with yellow labels)
    prompts:
      - "an I/O module rack with yellow labels"
      - "a column of terminal modules"
