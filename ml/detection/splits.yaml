# Company photos are NEVER used for training. They are split into:
#
#   dev:  photos you MAY look at while choosing OWLv2 prompts and thresholds (tuning).
#   test: photos you must NOT tune on. The final scores come from these only.
#
# Why two groups: if you change prompts until the boxes look good on a photo, that photo
# no longer gives an honest score. Keep the test photos for the final measurement.
# All three classes (power_supply, mcb, io_module) appear in the test photos.
#
# The detector is trained on public datasets only (see public_class_map.yaml), so train/valid
# stay empty here: build_dataset.py fills them from data/external/.
train: []
valid: []
dev:
  - cab1_power_supplies_closeup
  - cab1_breakers_CB11-CB16_closeup
test:
  - cab1_full_front
  - cab1_lower_front_io
  - cab2_full_front_3_columns
